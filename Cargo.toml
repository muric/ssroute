[package]
name = "ssroute"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
shadowsocks-service = { version = "1.24", features = ["local", "local-tun", "aead-cipher-2022"] }
nix = { version = "0.29", features = ["ioctl", "net", "poll", "signal", "fs"] }
rtnetlink = "0.14"
netlink-packet-route = "0.19"
netlink-packet-core = "0.7"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1"
ipnet = "2"
futures = "0.3"
zbus = "4.0"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "muric"
depends = "ssroute-data"
recommends = "ssroute-data"
section = "net"
priority = "optional"
assets = [
    ["target/release/ssroute", "usr/bin/", "755"],
    ["ssroute.conf.example", "etc/ssroute/ssroute.conf.example", "644"],
    ["ssroute.service", "lib/systemd/system/ssroute.service", "644"],
]
maintainer-scripts = "debian/"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
