name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Rust toolchain
      uses: rust-lang/rustup-action@master
      with:
        toolchain: stable
        profile: minimal
        components: rustfmt, clippy

    - name: Run linter
      run: cargo clippy --all-targets --all-features -- -D warnings
