name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: cross build --release --target ${{ matrix.target }}

      - name: Package release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          DIR="ssroute-${TAG}-${{ matrix.target }}"
          mkdir -p "$DIR"
          cp target/${{ matrix.target }}/release/ssroute "$DIR/"
          cp ssroute.conf.example "$DIR/"
          cp ssroute.service "$DIR/"
          cp -r data "$DIR/"
          cp -r default_route "$DIR/"
          tar czf "${DIR}.tar.gz" "$DIR"
          echo "TARBALL=${DIR}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssroute-${{ matrix.target }}
          path: ${{ env.TARBALL }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ssroute-*.tar.gz
            install.sh
          generate_release_notes: true
