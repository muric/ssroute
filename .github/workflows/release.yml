name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: amd64
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross and cargo-deb
        run: |
          cargo install cross --locked
          cargo install cargo-deb --locked

      - name: Build with cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build deb package
        run: cargo deb --no-build --target ${{ matrix.target }}

      - name: Rename deb for release
        run: |
          DEB=$(find target/${{ matrix.target }}/debian -name '*.deb' | head -1)
          cp "$DEB" "ssroute_${{ matrix.arch }}.deb"
          cp "$DEB" "ssroute_${{ steps.version.outputs.version }}_${{ matrix.arch }}.deb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssroute-${{ matrix.arch }}
          path: ssroute_*.deb

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ssroute_*.deb
          generate_release_notes: true
